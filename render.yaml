services:
  - type: web
    name: exam-portal-backend
    env: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_NAME
        value: "Exam Portal"
      - key: API_V1_STR
        value: "/api"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: exam-portal-db
          property: connectionString

databases:
  - name: exam-portal-db
    databaseName: exam_portal
    user: examuser
    plan: free
    region: oregon
