version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam_portal_db
    environment:
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampassword
      POSTGRES_DB: exam_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examuser -d exam_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: exam_portal_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://examuser:exampassword@postgres:5432/exam_portal
      - SECRET_KEY=exam-portal-secure-secret-key-development-2026-xyz-abc
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: exam_portal_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
